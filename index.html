<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labolycée - Explorateur d'Exercices</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🔬</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-display: 'Crimson Pro', serif;
            --font-body: 'DM Sans', sans-serif;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* CHROME — thème original (forcé) */
        html[data-force-chrome] {
            --primary: #30191E;
            --secondary: #4F3439;
            --accent: #6B4C51;
            --text: #f8f9fa;
            --text-muted: rgba(255,255,255,0.6);
            --text-muted-light: rgba(255,255,255,0.7);
            --highlight: #e94560;
            --highlight-dim: #d63951;
            --highlight-light: #ff6b9d;
            --glass-bg: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.1);
            --glass-bg-hover: rgba(255,255,255,0.1);
            --glass-bg-elevated: rgba(255,255,255,0.15);
            --input-bg: rgba(255,255,255,0.1);
            --input-border: rgba(255,255,255,0.2);
            --input-bg-hover: rgba(255,255,255,0.15);
            --input-placeholder: rgba(255,255,255,0.5);
            --range-track-bg: rgba(255,255,255,0.12);
            --card-bg: rgba(255,255,255,0.05);
            --card-border: rgba(255,255,255,0.1);
            --select-option-bg: #4F3439;
            --border-subtle: rgba(255,255,255,0.1);
            --tag-bg: rgba(255,255,255,0.1);
            --tag-border: rgba(255,255,255,0.2);
            --stat-border: rgba(255,255,255,0.1);
            --highlight-focus: rgba(233,69,96,0.2);
            --highlight-shadow: rgba(233,69,96,0.3);
            --highlight-shadow-lg: rgba(233,69,96,0.4);
            --highlight-shadow-xl: rgba(233,69,96,0.5);
            --card-hover-shadow: rgba(233,69,96,0.3);
            --shadow: 0 8px 32px rgba(0,0,0,0.5);
            --sep-color: rgba(255,255,255,0.3);
            --range-thumb-shadow: rgba(0,0,0,0.3);
            --range-track-fill: var(--highlight);
            --btn-gradient-to: #ff6b9d;
        }

        /* LIGHT theme — tons froids, très éloigné du bordeaux/rouge de Chrome */
        html[data-theme="light"]:not([data-force-chrome]) {
            --primary: #f8fafc;
            --secondary: #f1f5f9;
            --accent: #e2e8f0;
            --text: #0f172a;
            --text-muted: rgba(0,0,0,0.4);
            --text-muted-light: rgba(0,0,0,0.5);
            --highlight: #0d9488;
            --highlight-dim: #0f766e;
            --highlight-light: #2dd4bf;
            --glass-bg: rgba(255,255,255,0.9);
            --glass-border: rgba(0,0,0,0.06);
            --glass-bg-hover: rgba(0,0,0,0.03);
            --glass-bg-elevated: rgba(0,0,0,0.06);
            --input-bg: rgba(255,255,255,0.85);
            --input-border: rgba(0,0,0,0.12);
            --input-bg-hover: rgba(255,255,255,1);
            --input-placeholder: rgba(0,0,0,0.3);
            --range-track-bg: rgba(0,0,0,0.08);
            --card-bg: rgba(255,255,255,0.95);
            --card-border: rgba(0,0,0,0.06);
            --select-option-bg: #ffffff;
            --border-subtle: rgba(0,0,0,0.06);
            --tag-bg: rgba(0,0,0,0.03);
            --tag-border: rgba(0,0,0,0.08);
            --stat-border: rgba(0,0,0,0.06);
            --highlight-focus: rgba(13,148,136,0.15);
            --highlight-shadow: rgba(13,148,136,0.2);
            --highlight-shadow-lg: rgba(13,148,136,0.25);
            --highlight-shadow-xl: rgba(13,148,136,0.3);
            --card-hover-shadow: rgba(13,148,136,0.15);
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --sep-color: rgba(0,0,0,0.12);
            --range-thumb-shadow: rgba(0,0,0,0.12);
            --range-track-fill: var(--highlight);
            --btn-gradient-to: #2dd4bf;
        }

        /* DARK/NIGHT theme */
        html[data-theme="dark"]:not([data-force-chrome]) {
            --primary: #0d1117;
            --secondary: #111820;
            --accent: #161b22;
            --text: #e2e8f0;
            --text-muted: rgba(255,255,255,0.45);
            --text-muted-light: rgba(255,255,255,0.55);
            --highlight: #4facde;
            --highlight-dim: #3a8ab5;
            --highlight-light: #6fc2f0;
            --glass-bg: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.06);
            --glass-bg-hover: rgba(255,255,255,0.07);
            --glass-bg-elevated: rgba(255,255,255,0.1);
            --input-bg: rgba(255,255,255,0.06);
            --input-border: rgba(255,255,255,0.12);
            --input-bg-hover: rgba(255,255,255,0.1);
            --input-placeholder: rgba(255,255,255,0.35);
            --range-track-bg: rgba(255,255,255,0.08);
            --card-bg: rgba(255,255,255,0.03);
            --card-border: rgba(255,255,255,0.06);
            --select-option-bg: #161b22;
            --border-subtle: rgba(255,255,255,0.06);
            --tag-bg: rgba(255,255,255,0.06);
            --tag-border: rgba(255,255,255,0.1);
            --stat-border: rgba(255,255,255,0.06);
            --highlight-focus: rgba(79,172,222,0.2);
            --highlight-shadow: rgba(79,172,222,0.2);
            --highlight-shadow-lg: rgba(79,172,222,0.25);
            --highlight-shadow-xl: rgba(79,172,222,0.3);
            --card-hover-shadow: rgba(79,172,222,0.15);
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --sep-color: rgba(255,255,255,0.15);
            --range-thumb-shadow: rgba(0,0,0,0.3);
            --range-track-fill: var(--highlight);
            --btn-gradient-to: #6fc2f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 50%, var(--accent) 100%);
            min-height: 100vh;
            color: var(--text);
            padding: 20px;
            transition: background var(--transition), color var(--transition);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }
        .header-left { text-align: left; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
            padding-top: 0.25rem;
        }

        html[data-force-chrome] .theme-toggle { display: none; }

        h1 {
            font-family: var(--font-display);
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(45deg, var(--text), var(--highlight));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-muted-light);
            font-weight: 300;
        }

        .filters-section {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .filter-group {
            position: relative;
        }

        .filter-label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        select, input[type="file"] {
            width: 100%;
            padding: 15px 20px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-family: var(--font-body);
            transition: all 0.3s ease;
        }

        .theme-search {
            width: 100%;
            padding: 12px 20px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.95rem;
            font-family: var(--font-body);
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .title-search {
            width: 100%;
            padding: 15px 20px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-family: var(--font-body);
            transition: all 0.3s ease;
        }

        .title-search::placeholder {
            color: var(--input-placeholder);
        }

        .title-search:focus {
            outline: none;
            border-color: var(--highlight);
            box-shadow: 0 0 0 4px var(--highlight-focus);
            background: var(--glass-bg-elevated);
        }

        .csv-fallback {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .upload-btn {
            display: inline-block;
            background: var(--highlight);
            color: white;
            padding: 15px 40px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .upload-btn:hover {
            background: var(--highlight-dim);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--highlight-shadow-lg);
        }

        .range-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .range-value {
            background: var(--glass-bg-hover);
            padding: 6px 16px;
            border-radius: 8px;
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 600;
            min-width: 70px;
            text-align: center;
        }

        .range-sep {
            color: var(--sep-color);
            font-size: 1.1rem;
        }

        .dual-range {
            position: relative;
            height: 36px;
        }

        .dual-range::before {
            content: '';
            position: absolute;
            inset: 50% 0 auto 0;
            height: 6px;
            transform: translateY(-50%);
            background: var(--range-track-bg);
            border-radius: 3px;
        }

        .dual-range-track {
            position: absolute;
            height: 6px;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 3px;
            background: var(--range-track-fill);
        }

        .range-thumb {
            position: absolute;
            width: 100%;
            height: 6px;
            top: 50%;
            transform: translateY(-50%);
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            pointer-events: none;
            margin: 0;
            padding: 0;
        }

        .range-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--highlight);
            cursor: pointer;
            pointer-events: auto;
            border: 3px solid var(--text);
            box-shadow: 0 2px 8px var(--range-thumb-shadow);
            transition: transform 0.15s ease;
        }

        .range-thumb::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .range-thumb::-moz-range-track {
            background: transparent;
            border: none;
        }

        .range-thumb::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--highlight);
            cursor: pointer;
            pointer-events: auto;
            border: 3px solid var(--text);
            box-shadow: 0 2px 8px var(--range-thumb-shadow);
        }

        .range-thumb--max::-webkit-slider-thumb {
            background: var(--highlight-light);
        }

        .range-thumb--max::-moz-range-thumb {
            background: var(--highlight-light);
        }

        select[multiple] {
            padding: 10px;
        }

        select[multiple] option {
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        select[multiple] option:disabled {
            cursor: not-allowed;
            opacity: 0.3;
        }

        select[multiple] option:checked {
            background: var(--highlight);
            color: white;
        }

        .theme-checkboxes {
            background: var(--glass-bg-hover);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .theme-checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: var(--glass-bg);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-checkbox-item:hover {
            background: var(--glass-bg-hover);
        }

        .theme-checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: var(--highlight);
        }

        .theme-checkbox-item label {
            flex: 1;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text);
            margin: 0;
        }

        .reset-btn {
            width: 100%;
            padding: 12px 20px;
            background: var(--glass-bg-hover);
            border: 2px solid var(--input-border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reset-btn:hover {
            background: var(--highlight);
            border-color: var(--highlight);
            transform: translateY(-2px);
        }

        .search-btn {
            width: 100%;
            padding: 18px 30px;
            background: linear-gradient(135deg, var(--highlight), var(--btn-gradient-to));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
            box-shadow: 0 5px 20px var(--highlight-shadow);
        }

        .search-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px var(--highlight-shadow-xl);
        }

        .search-btn:active {
            transform: translateY(-1px);
        }

        select:hover, input[type="file"]:hover {
            border-color: var(--highlight);
            background: var(--input-bg-hover);
        }

        select:focus, input[type="file"]:focus {
            outline: none;
            border-color: var(--highlight);
            box-shadow: 0 0 0 4px var(--highlight-focus);
        }

        select option {
            background: var(--secondary);
            color: var(--text);
            padding: 10px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid var(--stat-border);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--highlight);
            display: block;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .results-section {
            animation: fadeInUp 0.8s ease-out 0.4s backwards;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .exercise-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .exercise-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--highlight), var(--highlight-light));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .exercise-card:hover {
            transform: translateY(-5px);
            border-color: var(--highlight);
            box-shadow: 0 10px 40px var(--card-hover-shadow);
        }

        .exercise-card:hover::before {
            transform: scaleX(1);
        }

        .exercise-title {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .points-badge {
            background: var(--highlight);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .duration-badge {
            background: var(--tag-bg);
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-left: 10px;
        }

        .themes {
            margin-top: 15px;
        }

        .theme-tag {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-right: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--tag-border);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        /* ── THEME TOGGLE ── */
        .theme-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
        }
        .theme-toggle-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .toggle-track {
            width: 42px;
            height: 22px;
            background: var(--glass-bg-hover);
            border: 1px solid var(--glass-border);
            border-radius: 99px;
            position: relative;
            transition: background var(--transition);
        }
        .toggle-track.active { background: var(--highlight); }
        .toggle-thumb {
            width: 16px;
            height: 16px;
            background: var(--text);
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: transform var(--transition);
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .toggle-track.active .toggle-thumb { transform: translateX(20px); }

        .theme-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .filters-grid {
                grid-template-columns: 1fr;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>Labolycée</h1>
                <p class="subtitle">Explorez et filtrez les exercices de physique-chimie</p>
            </div>
            <div class="header-right">
                <label class="theme-toggle" id="themeToggle" title="Basculer clair/nuit">
                    <span class="theme-toggle-label" id="themeLabel">Nuit</span>
                    <div class="toggle-track" id="toggleTrack">
                        <div class="toggle-thumb"></div>
                    </div>
                </label>
            </div>
        </header>

        <div class="filters-section">
            <div class="filters-grid" id="filtersGrid">
                <div class="filter-group csv-fallback" id="csvFallback" style="display: none;">
                    <label for="csvFile" class="upload-btn">📁 Charger un fichier CSV</label>
                    <input type="file" id="csvFile" accept=".csv" style="display: none;" />
                </div>

                <div class="filter-group" id="titleSearchGroup" style="display: none;">
                    <label class="filter-label" for="titleSearch">Rechercher par titre</label>
                    <input type="text" id="titleSearch" class="title-search" placeholder="🔍 Rechercher dans les titres...">
                </div>

                <div class="filter-group" id="pointsGroup" style="display: none;">
                    <label class="filter-label">Points</label>
                    <div class="range-display">
                        <span class="range-value" id="pointsDisplayMin">—</span>
                        <span class="range-sep">–</span>
                        <span class="range-value" id="pointsDisplayMax">—</span>
                    </div>
                    <div class="dual-range" id="pointsRange">
                        <div class="dual-range-track" id="pointsTrack"></div>
                        <input type="range" id="pointsMin" class="range-thumb range-thumb--min">
                        <input type="range" id="pointsMax" class="range-thumb range-thumb--max">
                    </div>
                </div>

                <div class="filter-group" id="themesGroup" style="display: none;">
                    <label class="filter-label" for="themeFilter">Thèmes et niveaux</label>
                    <input type="text" id="themeSearch" class="theme-search" placeholder="🔍 Rechercher un thème...">
                    <div class="theme-checkboxes" id="themeCheckboxes"></div>
                    <button class="reset-btn" id="resetThemes">Réinitialiser les thèmes</button>
                </div>

                <div class="filter-group" id="dureeGroup" style="display: none;">
                    <label class="filter-label">Durée</label>
                    <div class="range-display">
                        <span class="range-value" id="dureeDisplayMin">—</span>
                        <span class="range-sep">–</span>
                        <span class="range-value" id="dureeDisplayMax">—</span>
                    </div>
                    <div class="dual-range" id="dureeRange">
                        <div class="dual-range-track" id="dureeTrack"></div>
                        <input type="range" id="dureeMin" class="range-thumb range-thumb--min">
                        <input type="range" id="dureeMax" class="range-thumb range-thumb--max">
                    </div>
                </div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-value" id="totalExercises">0</span>
                    <span class="stat-label">Exercices totaux</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="filteredExercises">0</span>
                    <span class="stat-label">Exercices affichés</span>
                </div>
            </div>

            <button class="search-btn" id="searchBtn" style="display: none;">🔍 Rechercher</button>
        </div>

        <div class="results-section">
            <div class="results-grid" id="resultsGrid"></div>
        </div>
    </div>

    <script>
        // ── CHROME DETECTION & THEME TOGGLE ──
        const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
        if (isChrome) {
            document.documentElement.setAttribute('data-force-chrome', '');
        } else {
            const saved = localStorage.getItem('labolycee-theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            updateToggleUI(saved);
        }

        function updateToggleUI(theme) {
            const track = document.getElementById('toggleTrack');
            const label = document.getElementById('themeLabel');
            if (!track || !label) return;
            if (theme === 'dark') {
                track.classList.add('active');
                label.textContent = 'Jour';
            } else {
                track.classList.remove('active');
                label.textContent = 'Nuit';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                toggle.addEventListener('click', () => {
                    if (isChrome) return;
                    const current = document.documentElement.getAttribute('data-theme');
                    const next = current === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', next);
                    localStorage.setItem('labolycee-theme', next);
                    updateToggleUI(next);
                });
            }
        });

        let exercises = [];
        let allExercises = [];

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            handleCSVFile(file);
        });

        function handleCSVFile(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                parseCSV(event.target.result);
                document.getElementById('csvFallback').style.display = 'none';
                showFilters();
            };
            reader.readAsText(file);
        }

        function showFilters() {
            document.getElementById('titleSearchGroup').style.display = 'block';
            document.getElementById('pointsGroup').style.display = 'block';
            document.getElementById('themesGroup').style.display = 'block';
            document.getElementById('dureeGroup').style.display = 'block';
            document.getElementById('searchBtn').style.display = 'block';
        }

        function parseCSV(csvData) {
            const lines = csvData.split('\n');
            const headers = lines[0].split(';');

            allExercises = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;

                const values = lines[i].split(';');
                const exercise = {
                    title: values[0],
                    url: values[1],
                    nb_points: values[2],
                    theme: values[3] ? values[3].split('|').map(t => t.trim()) : [],
                    duree: values[4]
                };
                exercise.points_num = parseFloat(exercise.nb_points) || 0;
                exercise.duree_min = parseDuree(exercise.duree);
                allExercises.push(exercise);
            }

            exercises = [...allExercises];
            createThemeCheckboxes();

            const pointsValues = allExercises.map(ex => ex.points_num);
            const dureeValues = allExercises.map(ex => ex.duree_min);

            initDualRange({
                minId: 'pointsMin', maxId: 'pointsMax',
                trackId: 'pointsTrack',
                displayMinId: 'pointsDisplayMin', displayMaxId: 'pointsDisplayMax',
                dataValues: pointsValues, formatter: formatPoints
            });

            initDualRange({
                minId: 'dureeMin', maxId: 'dureeMax',
                trackId: 'dureeTrack',
                displayMinId: 'dureeDisplayMin', displayMaxId: 'dureeDisplayMax',
                dataValues: dureeValues, formatter: formatDuree
            });

            updateAllFilters();
            document.getElementById('resultsGrid').innerHTML = '<div class="no-results">Sélectionnez vos critères et cliquez sur "Rechercher"</div>';
            updateStats(allExercises.length, 0);
        }

        function createThemeCheckboxes() {
            const themes = new Set();
            exercises.forEach(ex => ex.theme.forEach(t => { if (t) themes.add(t); }));

            const themeCheckboxes = document.getElementById('themeCheckboxes');
            themeCheckboxes.innerHTML = '';
            
            [...themes].sort().forEach(t => {
                const div = document.createElement('div');
                div.className = 'theme-checkbox-item';
                div.dataset.theme = t;
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `theme-${t.replace(/\s+/g, '-')}`;
                checkbox.value = t;
                
                const label = document.createElement('label');
                label.htmlFor = checkbox.id;
                label.textContent = t;
                
                div.appendChild(checkbox);
                div.appendChild(label);
                themeCheckboxes.appendChild(div);
                
                checkbox.addEventListener('change', onThemeChange);
                div.addEventListener('click', function(e) {
                    if (e.target !== checkbox) {
                        checkbox.checked = !checkbox.checked;
                        onThemeChange();
                    }
                });
            });
        }

        document.getElementById('searchBtn').addEventListener('click', filterExercises);
        
        // Recherche par titre
        document.getElementById('titleSearch').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            if (searchTerm === '') {
                exercises = [...allExercises];
            } else {
                exercises = allExercises.filter(ex => 
                    ex.title && ex.title.toLowerCase().includes(searchTerm)
                );
            }
            
            updateAllFilters();
        });
        
        // Recherche de thèmes
        document.getElementById('themeSearch').addEventListener('input', function() {
            updateAllFilters();
        });
        
        document.getElementById('resetThemes').addEventListener('click', function() {
            document.querySelectorAll('.theme-checkbox-item input[type="checkbox"]').forEach(cb => {
                cb.checked = false;
            });
            document.getElementById('themeSearch').value = '';
            updateAllFilters();
        });

        function onThemeChange() {
            document.getElementById('themeSearch').value = '';
            updateAllFilters();
        }

        function parseDuree(raw) {
            if (!raw) return 0;
            let minutes = 0;
            const h = raw.match(/(\d+)\s*heure/);
            if (h) minutes += parseInt(h[1]) * 60;
            const m = raw.match(/(\d+)\s*minutes?/);
            if (m) minutes += parseInt(m[1]);
            return minutes || 0;
        }

        function formatPoints(n) {
            if (n === 0) return '—';
            return n % 1 === 0 ? `${n} pts` : `${n} pt`;
        }

        function formatDuree(minutes) {
            if (minutes === 0) return '—';
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            if (h === 0) return `${m}min`;
            if (m === 0) return `${h}h`;
            return `${h}h${m}`;
        }

        function initDualRange(config) {
            const { minId, maxId, trackId, displayMinId, displayMaxId, dataValues, formatter } = config;

            const minEl = document.getElementById(minId);
            const maxEl = document.getElementById(maxId);
            const trackEl = document.getElementById(trackId);
            const displayMin = document.getElementById(displayMinId);
            const displayMax = document.getElementById(displayMaxId);

            const validValues = [...new Set(dataValues.filter(v => v > 0))].sort((a, b) => a - b);
            const dataMin = validValues.length > 0 ? validValues[0] : 0;
            const dataMax = validValues.length > 0 ? validValues[validValues.length - 1] : 100;

            let step = 1;
            if (validValues.length > 1) {
                const diffs = [];
                for (let i = 1; i < validValues.length; i++) {
                    diffs.push(validValues[i] - validValues[i - 1]);
                }
                const minDiff = Math.min(...diffs);
                if (minDiff > 0) step = minDiff;
            }

            function snapToNearest(value) {
                if (value <= dataMin) return dataMin;
                if (validValues.length === 0) return value;
                return validValues.reduce((prev, curr) =>
                    Math.abs(curr - value) < Math.abs(prev - value) ? curr : prev
                );
            }

            minEl.min = dataMin;
            minEl.max = dataMax;
            minEl.step = step;
            minEl.value = dataMin;

            maxEl.min = dataMin;
            maxEl.max = dataMax;
            maxEl.step = step;
            maxEl.value = dataMax;

            function updateDisplay() {
                let minVal = parseFloat(minEl.value);
                let maxVal = parseFloat(maxEl.value);

                displayMin.textContent = formatter(minVal);
                displayMax.textContent = formatter(maxVal);

                const total = dataMax - dataMin;
                const leftPct = total > 0 ? ((minVal - dataMin) / total) * 100 : 0;
                const rightPct = total > 0 ? ((dataMax - maxVal) / total) * 100 : 0;
                trackEl.style.left = leftPct + '%';
                trackEl.style.right = rightPct + '%';
            }

            function onInput(which) {
                if (which === 'min') {
                    const snapped = snapToNearest(parseFloat(minEl.value));
                    minEl.value = snapped;
                    if (snapped > parseFloat(maxEl.value)) {
                        maxEl.value = snapped;
                    }
                } else {
                    const snapped = snapToNearest(parseFloat(maxEl.value));
                    maxEl.value = snapped;
                    if (snapped < parseFloat(minEl.value)) {
                        minEl.value = snapped;
                    }
                }
                updateDisplay();
                updateAllFilters();
            }

            minEl.addEventListener('input', () => onInput('min'));
            maxEl.addEventListener('input', () => onInput('max'));

            updateDisplay();
        }

        function getFilteredExercises(exercisesList, filters) {
            return exercisesList.filter(ex => {
                const fullRangePoints = filters.pointsMin === filters.pointsDataMin && filters.pointsMax === filters.pointsDataMax;
                const matchPoints = fullRangePoints
                    || (ex.points_num >= filters.pointsMin && ex.points_num <= filters.pointsMax);
                const matchTheme = filters.themes.length === 0
                    || filters.themes.every(theme => ex.theme.includes(theme));
                const fullRangeDuree = filters.dureeMin === filters.dureeDataMin && filters.dureeMax === filters.dureeDataMax;
                const matchDuree = fullRangeDuree
                    || (ex.duree_min >= filters.dureeMin && ex.duree_min <= filters.dureeMax);
                return matchPoints && matchTheme && matchDuree;
            });
        }

        function updateAllFilters() {
            const filters = {
                pointsMin: parseFloat(document.getElementById('pointsMin').value),
                pointsMax: parseFloat(document.getElementById('pointsMax').value),
                pointsDataMin: parseFloat(document.getElementById('pointsMin').min),
                pointsDataMax: parseFloat(document.getElementById('pointsMax').max),
                themes: getSelectedThemes(),
                dureeMin: parseFloat(document.getElementById('dureeMin').value),
                dureeMax: parseFloat(document.getElementById('dureeMax').value),
                dureeDataMin: parseFloat(document.getElementById('dureeMin').min),
                dureeDataMax: parseFloat(document.getElementById('dureeMax').max)
            };

            const compatibleExercises = getFilteredExercises(exercises, filters);
            updateThemeOptions(compatibleExercises, filters.themes);
        }

        function updateThemeOptions(compatibleExercises, selectedThemes) {
            const availableThemes = new Set(selectedThemes);
            
            compatibleExercises.forEach(ex => {
                ex.theme.forEach(t => availableThemes.add(t));
            });

            const searchTerm = document.getElementById('themeSearch').value.toLowerCase();

            document.querySelectorAll('.theme-checkbox-item').forEach(item => {
                const theme = item.dataset.theme;
                const matchesSearch = !searchTerm || theme.toLowerCase().includes(searchTerm);
                const isAvailable = availableThemes.has(theme);
                
                if (isAvailable && matchesSearch) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                    if (!isAvailable) {
                        const checkbox = item.querySelector('input[type="checkbox"]');
                        if (checkbox && checkbox.checked) {
                            checkbox.checked = false;
                        }
                    }
                }
            });
        }

        function getSelectedThemes() {
            const checkboxes = document.querySelectorAll('.theme-checkbox-item input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        function filterExercises() {
            const filters = {
                pointsMin: parseFloat(document.getElementById('pointsMin').value),
                pointsMax: parseFloat(document.getElementById('pointsMax').value),
                pointsDataMin: parseFloat(document.getElementById('pointsMin').min),
                pointsDataMax: parseFloat(document.getElementById('pointsMax').max),
                themes: getSelectedThemes(),
                dureeMin: parseFloat(document.getElementById('dureeMin').value),
                dureeMax: parseFloat(document.getElementById('dureeMax').value),
                dureeDataMin: parseFloat(document.getElementById('dureeMin').min),
                dureeDataMax: parseFloat(document.getElementById('dureeMax').max)
            };

            const filtered = getFilteredExercises(exercises, filters);

            displayExercises(filtered);
            updateStats(allExercises.length, filtered.length);
        }

        function displayExercises(exercisesList) {
            const grid = document.getElementById('resultsGrid');
            
            if (exercisesList.length === 0) {
                grid.innerHTML = '<div class="no-results">Aucun exercice trouvé avec ces filtres</div>';
                return;
            }

            grid.innerHTML = exercisesList.map(ex => `
                <div class="exercise-card" onclick="window.open('${ex.url}', '_blank')">
                    ${ex.title ? `<h3 class="exercise-title">${ex.title}</h3>` : ''}
                    <div class="exercise-header">
                        <div>
                            ${ex.nb_points ? `<span class="points-badge">${ex.nb_points}</span>` : ''}
                            ${ex.duree ? `<span class="duration-badge">⏱️ ${ex.duree}</span>` : ''}
                        </div>
                    </div>
                    ${ex.theme.length > 0 ? `
                        <div class="themes">
                            ${ex.theme.map(t => `<span class="theme-tag">${t}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function updateStats(total, filtered) {
            document.getElementById('totalExercises').textContent = total;
            document.getElementById('filteredExercises').textContent = filtered;
        }

        // Chargement automatique du CSV
        fetch('labolycee.org_exercises.csv')
            .then(response => {
                if (!response.ok) throw new Error('Erreur ' + response.status);
                return response.text();
            })
            .then(csvData => {
                parseCSV(csvData);
                showFilters();
            })
            .catch(() => {
                document.getElementById('csvFallback').style.display = 'flex';
            });
    </script>
</body>
</html>
